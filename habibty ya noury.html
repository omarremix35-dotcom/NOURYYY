<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>habibty ya noury</title>
<style>
:root{--bg:#fff0f3;--text:#fff;--heart:#e0102f;--heart2:#b80a24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a0509;--text:#fff;--heart:#ff1f3d;--heart2:#c4112b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0509;--text:#fff;--heart:#ff1f3d;--heart2:#c4112b;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
.wrap{position:relative;display:flex;align-items:center;justify-content:center}
.heart{position:relative;width:min(80vw,460px);aspect-ratio:1;animation:beat 1.4s infinite ease-in-out;filter:drop-shadow(0 12px 30px rgba(224,16,47,.5))}
.heart svg{width:100%;height:100%;display:block}
.heart span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text);font-size:clamp(1.6rem,7vw,3rem);font-weight:bold;font-style:italic;line-height:1.2;padding:0 22% 8%;text-shadow:0 2px 6px rgba(0,0,0,.35)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
#msg{pointer-events:none;opacity:0;transform:scale(.3);transition:opacity .6s ease,transform .6s cubic-bezier(.2,1.4,.4,1)}
.show #msg{opacity:1;transform:scale(1)}
#btn{z-index:2;position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);padding:14px 28px;font-size:clamp(1rem,4.5vw,1.6rem);font-family:inherit;font-weight:bold;color:var(--heart2);background:#fff;border:none;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .2s,opacity .4s}
#btn:hover{transform:translate(-50%,-50%) scale(1.08)}
.show #btn{opacity:0;pointer-events:none}
.float{position:fixed;bottom:-60px;color:var(--heart);opacity:.6;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-120vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="heart">
    <svg viewBox="0 0 100 90" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--heart)"/><stop offset="1" stop-color="var(--heart2)"/></linearGradient></defs>
      <path d="M50 85C20 62 4 46 4 28 4 15 14 6 26 6c10 0 18 5 24 14C56 11 64 6 74 6c12 0 22 9 22 22 0 18-16 34-46 57z" fill="url(#g)"/>
    </svg>
    <button id="btn" type="button">Press me ♥</button>
    <span id="msg">habibty ya noury</span>
  </div>
</div>
<script>
document.getElementById('btn').addEventListener('click',()=>document.querySelector('.heart').classList.add('show'));
for(let i=0;i<24;i++){
  const h=document.createElement('div');
  h.className='float';
  h.textContent='\u2665';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(20+Math.random()*50)+'px';
  h.style.animationDuration=(6+Math.random()*8)+'s';
  h.style.animationDelay=(-Math.random()*10)+'s';
  document.body.appendChild(h);
}
</script>
</body>
</html>
